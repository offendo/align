[project]
name = "align"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nilay Patel", email = "nilaypatel2@gmail.com" }
]
dependencies = [
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "unsloth>=2025.11.6",
    "unsloth-zoo>=2025.11.6",
    "vllm>=0.12.0",
    "more-itertools>=10.8.0",
    "lean-utils @ git+https://github.com/offendo/lean_utils",
    "transformers==4.57.3",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ipython>=9.7.0",
    "jupyter>=1.1.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/align"]

[tool.ruff]
line-length = 120
