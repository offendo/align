[project]
name = "align"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nilay Patel", email = "nilaypatel2@gmail.com" }
]
dependencies = [
    "pandas>=2.3.3",
    "accelerate>=1.11.0",
    "torch>=2.9.1",
    "datasets>=4.4.1",
    "more-itertools>=10.8.0",
    "transformers>=4.57.1",
    "peft>=0.18.0",
    "typer>=0.20.0",
    "scikit-learn>=1.7.2",
    "trl>=0.25.1",
    "tqdm>=4.67.1",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ipython>=9.7.0",
    "jupyter>=1.1.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/align"]

[tool.black]
line-length = 119
